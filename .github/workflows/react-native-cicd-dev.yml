name: React Native CI/CD

permissions:
  contents: write

on:
  push:
    branches: [DEV]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"

  workflow_dispatch:
    inputs:
      buildType:
        type: choice
        description: "Build type to run"
        options:
          - dev

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  NODE_OPTIONS: --openssl-legacy-provider

jobs:
  check-skip:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Skip CI check
        run: echo "Proceeding with workflow"

  test:
    needs: check-skip
    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: 📦 Install dependencies
        run: yarn install

      - name: 🧪 Run TypeScript check
        run: yarn check-types

      - name: 🧹 Run ESLint
        run: yarn lint

  build:
    needs: test

    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/DEV') ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Disk diagnostics
      # ---------------------------------------------------------

      - name: 💾 Check initial disk space
        run: |
          echo "========================================"
          echo "INITIAL DISK SPACE"
          echo "========================================"

          df -h /

          echo ""
          echo "========================================"
          echo "LARGEST ROOT DIRECTORIES"
          echo "========================================"

          sudo du -xhd1 / 2>/dev/null | sort -h | tail -20

          echo ""
          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          sudo du -sh /usr/local/lib/android/sdk/* 2>/dev/null | sort -h || true

      # ---------------------------------------------------------
      # Aggressive but safe cleanup
      # ---------------------------------------------------------

      - name: 🧹 Free disk space
        run: |
          set -e

          echo "========================================"
          echo "REMOVING UNUSED RUNNER SOFTWARE"
          echo "========================================"

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell

          echo ""
          echo "========================================"
          echo "CLEANING DOCKER"
          echo "========================================"

          sudo docker system prune -af || true

          echo ""
          echo "========================================"
          echo "CLEANING USER CACHES"
          echo "========================================"

          rm -rf ~/.cache
          rm -rf ~/.npm

          echo ""
          echo "========================================"
          echo "CLEANING GRADLE CACHES"
          echo "========================================"

          rm -rf ~/.gradle/caches
          rm -rf ~/.gradle/wrapper

          echo ""
          echo "========================================"
          echo "CLEANING ANDROID EMULATOR DATA"
          echo "========================================"

          # Android emulator system images are not required
          # to build an APK.
          sudo rm -rf /usr/local/lib/android/sdk/system-images

          # Emulator-related directories are also unnecessary
          # for a CI APK build.
          sudo rm -rf /usr/local/lib/android/sdk/emulator

          echo ""
          echo "========================================"
          echo "DISK SPACE AFTER CLEANUP"
          echo "========================================"

          df -h /

          echo ""
          echo "========================================"
          echo "ANDROID SDK AFTER CLEANUP"
          echo "========================================"

          sudo du -sh /usr/local/lib/android/sdk/* 2>/dev/null | sort -h || true

      - name: 💾 Check disk after cleanup
        run: |
          echo "========================================"
          echo "FILESYSTEM"
          echo "========================================"

          df -h /

          echo ""
          echo "========================================"
          echo "LARGEST ROOT DIRECTORIES"
          echo "========================================"

          sudo du -xhd1 / 2>/dev/null | sort -h | tail -20

          echo ""
          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          sudo du -sh /usr/local/lib/android/sdk/* 2>/dev/null | sort -h || true

      # ---------------------------------------------------------
      # Node / dependencies
      # ---------------------------------------------------------

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: 📦 Install dependencies
        run: yarn install

      - name: 💾 Check disk after dependency installation
        run: |
          echo "========================================"
          echo "FILESYSTEM"
          echo "========================================"

          df -h /

          echo ""
          echo "========================================"
          echo "NODE MODULES"
          echo "========================================"

          du -sh node_modules 2>/dev/null || true
          du -sh apps/mobile/node_modules 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "GRADLE"
          echo "========================================"

          du -sh ~/.gradle 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "CACHE"
          echo "========================================"

          du -sh ~/.cache 2>/dev/null || true

      # ---------------------------------------------------------
      # EAS
      # ---------------------------------------------------------

      - name: 📦 Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: 🔄 Verify EAS CLI
        run: eas --version

      # ---------------------------------------------------------
      # Android credentials
      # ---------------------------------------------------------

      - name: 🔑 Restore Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" |
            base64 --decode > apps/mobile/MindChart.keystore

      - name: 📝 Create local credentials.json
        working-directory: apps/mobile
        run: |
          echo '{
            "android": {
              "keystore": {
                "keystorePath": "./MindChart.keystore",
                "keystorePassword": "'"$EAS_BUILD_KEYSTORE_PASSWORD"'",
                "keyAlias": "'"$EAS_BUILD_KEYSTORE_ALIAS"'",
                "keyPassword": "'"$EAS_BUILD_KEY_PASSWORD"'"
              }
            }
          }' > credentials.json
        env:
          EAS_BUILD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EAS_BUILD_KEYSTORE_ALIAS: ${{ secrets.KEY_ALIAS }}
          EAS_BUILD_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      # ---------------------------------------------------------
      # Final disk check before build
      # ---------------------------------------------------------

      - name: 💾 Check disk before Android build
        run: |
          echo "========================================"
          echo "DISK BEFORE ANDROID BUILD"
          echo "========================================"

          df -h /

          echo ""
          echo "========================================"
          echo "GRADLE"
          echo "========================================"

          du -sh ~/.gradle 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "NODE MODULES"
          echo "========================================"

          du -sh node_modules 2>/dev/null || true
          du -sh apps/mobile/node_modules 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          sudo du -sh /usr/local/lib/android/sdk/* 2>/dev/null | sort -h || true

          echo ""
          echo "========================================"
          echo "WORKSPACE"
          echo "========================================"

          du -xhd2 . 2>/dev/null | sort -h | tail -30

      # ---------------------------------------------------------
      # Continuous disk monitor
      # ---------------------------------------------------------

      - name: 📊 Start disk monitor
        run: |
          (
            while true; do
              echo "===== $(date) ====="
              df -h /
              echo ""
              echo "Gradle:"
              du -sh ~/.gradle 2>/dev/null || true
              echo ""
              echo "Workspace:"
              du -sh . 2>/dev/null || true
              echo ""
              sleep 15
            done
          ) > /tmp/disk-monitor.log 2>&1 &

          echo $! > /tmp/disk-monitor.pid

      # ---------------------------------------------------------
      # Build
      # ---------------------------------------------------------

      - name: 📱 Build QA APK
        if: github.event_name == 'push' || github.event.inputs.buildType == 'dev'
        working-directory: apps/mobile
        run: |
          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"

          eas build \
            --platform android \
            --profile production \
            --local \
            --non-interactive \
            --output=../../MindChart-dev.apk
        env:
          NODE_ENV: production

          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx4096m
            -XX:MaxMetaspaceSize=1024m

          EAS_BUILD_KEYSTORE_PATH: "./MindChart.keystore"
          EAS_BUILD_KEYSTORE_ALIAS: "${{ secrets.KEY_ALIAS }}"
          EAS_BUILD_KEYSTORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}"
          EAS_BUILD_KEY_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}"

      # ---------------------------------------------------------
      # Diagnostics after build
      # ---------------------------------------------------------

      - name: 🛑 Stop disk monitor
        if: always()
        run: |
          if [ -f /tmp/disk-monitor.pid ]; then
            kill "$(cat /tmp/disk-monitor.pid)" || true
          fi

          echo "========================================"
          echo "DISK MONITOR LOG"
          echo "========================================"

          cat /tmp/disk-monitor.log || true

      - name: 💾 Check disk after Android build
        if: always()
        run: |
          echo "========================================"
          echo "FILESYSTEM AFTER BUILD"
          echo "========================================"

          df -h /

          echo ""
          echo "========================================"
          echo "GRADLE"
          echo "========================================"

          du -sh ~/.gradle 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "CACHE"
          echo "========================================"

          du -sh ~/.cache 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "WORKSPACE"
          echo "========================================"

          du -xhd2 . 2>/dev/null | sort -h | tail -30

      # ---------------------------------------------------------
      # APK
      # ---------------------------------------------------------

      - name: 🔑 Generate SHA256 for APK
        run: |
          sha256sum ./MindChart-dev.apk > MindChart-dev.apk.sha256

      - name: 📦 Upload build artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-builds
          path: |
            ./MindChart-dev.apk
            ./MindChart-dev.apk.sha256
          retention-days: 7

