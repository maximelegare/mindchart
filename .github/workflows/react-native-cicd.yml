name: React Native CI/CD

permissions:
  contents: write

on:
  push:
    branches: [QA]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  workflow_dispatch:
    inputs:
      buildType:
        type: choice
        description: "Build type to run"
        options:
          - prod

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  NODE_OPTIONS: --openssl-legacy-provider
  PUBLIC_REPO: maximelegare/mindchart

jobs:
  check-skip:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Skip CI check
        run: echo "Proceeding with workflow"

  test:
    needs: check-skip
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: 📦 Install dependencies
        run: yarn install

      - name: 🧪 Run TypeScript check
        run: yarn check-types

      - name: 🧹 Run ESLint
        run: yarn lint

  build-and-release:
    needs: test
    if: (github.event_name == 'push' && github.ref == 'refs/heads/QA') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: 📦 Install dependencies & EAS CLI
        run: |
          yarn install
          npm install -g eas-cli@latest

      - name: 🔄 Verify EAS CLI
        run: eas --version

      - name: 🔑 Restore Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > apps/mobile/MindChart.keystore

      - name: 📝 Create local credentials.json
        working-directory: apps/mobile
        env:
          EAS_BUILD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EAS_BUILD_KEYSTORE_ALIAS: ${{ secrets.KEY_ALIAS }}
          EAS_BUILD_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo '{
                "android": {
                  "keystore":{
                    "keystorePath": "./MindChart.keystore",
                    "keystorePassword": "'"$EAS_BUILD_KEYSTORE_PASSWORD"'",
                    "keyAlias": "'"$EAS_BUILD_KEYSTORE_ALIAS"'",
                    "keyPassword": "'"$EAS_BUILD_KEY_PASSWORD"'"
                  }
                }
              }' > credentials.json

      - name: 📱 Build Production APK
        if: github.event_name == 'push' || github.event.inputs.buildType == 'prod'
        working-directory: apps/mobile
        run: |
          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"
          eas build --platform android --profile production --local --non-interactive --output=../../MindChart-prod.apk
        env:
          NODE_ENV: production
          APP_VARIANT: qa
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
          EAS_BUILD_KEYSTORE_PATH: "./MindChart.keystore"
          EAS_BUILD_KEYSTORE_ALIAS: "${{ secrets.KEY_ALIAS }}"
          EAS_BUILD_KEYSTORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}"
          EAS_BUILD_KEY_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}"

      - name: 🔑 Generate SHA256 for APK
        run: sha256sum ./MindChart-prod.apk > MindChart-prod.apk.sha256

      - name: 🔄 Fetch git history
        run: |
          git fetch --prune --tags --force
          git fetch --unshallow || true

      - name: 🏷️ Generate build info & changelog
        id: build-info
        run: |
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          BUILD_DATE=$(date -u +"%Y-%m-%d")

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
              RANGE="--max-count=50"
          else
              RANGE="$LAST_TAG..HEAD"
          fi

          echo "## v$VERSION ($BUILD_DATE)" > changelog.md

          ALL_LOGS=$(git log $RANGE --pretty=format:"%s")

          FEATURE_LOGS=$(echo "$ALL_LOGS" | grep -Ei "^feat\s*(\(.*?\))?\s*:?" || true)
          NON_FEATURE_LOGS=$(echo "$ALL_LOGS" | grep -Eiv "^feat\s*(\(.*?\))?\s*:?" || true)

          if [ -n "$FEATURE_LOGS" ]; then
            echo "" >> changelog.md
            echo "## 🚀 Highlights" >> changelog.md
            echo "$FEATURE_LOGS" | sed 's/^/- /' >> changelog.md
          fi

          categories=(
            "🐛 Fixes:fix"
            "⚡ Improvements:perf|refactor|improve"
            "📝 Docs:docs"
            "⚙️ Chore:chore"
            "🔧 Build:build"
            "🤖 CI:ci"
            "🔄 Reverts:revert"
            "🎨 Style:style"
            "🧪 Tests:test"
          )

          for entry in "${categories[@]}"; do
            TITLE="${entry%%:*}"
            PATTERN="${entry#*:}"

            CATEGORY_LOG=$(echo "$NON_FEATURE_LOGS" | grep -Ei "^($PATTERN)\s*(\(.*?\))?\s*:?" | sed 's/^/- /' || true)

            if [ -n "$CATEGORY_LOG" ]; then
              echo "" >> changelog.md
              echo "### $TITLE" >> changelog.md
              echo "$CATEGORY_LOG" >> changelog.md
            fi
          done

      - name: 🔖 Tag source repository
        run: |
          VERSION="${{ steps.build-info.outputs.version }}"
          TAG="v${VERSION}"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists, skipping source tag."
            exit 0
          fi

          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: 📤 Publish README and draft release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          VERSION: ${{ steps.build-info.outputs.version }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "Add repository secret PUBLIC_REPO_TOKEN (a PAT with contents:write on ${PUBLIC_REPO})."
            exit 1
          fi

          TAG="v${VERSION}"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${PUBLIC_REPO}.git"

          rm -rf public-dist
          git clone --depth 1 "$REMOTE" public-dist || true
          if [ ! -d public-dist/.git ]; then
            mkdir -p public-dist
            git -C public-dist init
            git -C public-dist checkout -b main
            git -C public-dist remote add origin "$REMOTE"
          else
            git -C public-dist remote set-url origin "$REMOTE"
          fi

          git -C public-dist config user.name "github-actions"
          git -C public-dist config user.email "github-actions@github.com"

          mkdir -p public-dist/.github/images
          cp README.md public-dist/README.md
          cp .github/images/HEADER.png public-dist/.github/images/HEADER.png

          git -C public-dist add README.md .github/images/HEADER.png
          if git -C public-dist diff --cached --quiet && git -C public-dist rev-parse --verify HEAD >/dev/null 2>&1; then
            echo "Public README unchanged."
          else
            git -C public-dist commit --allow-empty -m "docs: update README for ${TAG}"
          fi

          git -C public-dist push -u origin HEAD:main

          if git -C public-dist ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Public tag ${TAG} already exists."
          else
            git -C public-dist tag -a "${TAG}" -m "Release ${TAG}"
            git -C public-dist push origin "refs/tags/${TAG}"
          fi

          if gh release view "${TAG}" --repo "${PUBLIC_REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              ./MindChart-prod.apk \
              ./MindChart-prod.apk.sha256 \
              --repo "${PUBLIC_REPO}" \
              --clobber
            gh release edit "${TAG}" \
              --repo "${PUBLIC_REPO}" \
              --title "${TAG}" \
              --notes-file changelog.md \
              --draft
          else
            gh release create "${TAG}" \
              ./MindChart-prod.apk \
              ./MindChart-prod.apk.sha256 \
              --repo "${PUBLIC_REPO}" \
              --title "${TAG}" \
              --notes-file changelog.md \
              --draft
          fi

      - name: 📦 Upload build artifacts to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-builds
          path: |
            ./MindChart-prod.apk
            ./MindChart-prod.apk.sha256
          retention-days: 7
