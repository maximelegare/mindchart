name: QA Production Release

permissions:
  contents: write

on:
  push:
    branches: [QA]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional note for this manual QA release"
        required: false
        type: string

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  NODE_OPTIONS: --openssl-legacy-provider
  PUBLIC_REPO: maximelegare/mindchart

jobs:
  check-skip:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      - name: Skip CI check
        run: echo "Proceeding with workflow"

  test:
    needs: check-skip
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: 📦 Install dependencies
        run: yarn install --immutable

      - name: 🧪 Run TypeScript check
        run: yarn check-types

      - name: 🧹 Run ESLint
        run: yarn lint

  build-and-release:
    needs: test
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/QA') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🧹 Free runner disk space
        run: |
          set -eux

          echo "===== BEFORE CLEANUP ====="
          df -h /
          df -ih /

          echo "===== LARGE RUNNER DIRECTORIES ====="
          sudo du -xhd1 / 2>/dev/null | sort -h | tail -20 || true

          echo "===== REMOVE UNUSED SOFTWARE ====="

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/lib/android/sdk/emulator

          echo "===== CLEAN DOCKER ====="

          sudo docker system prune -af --volumes || true

          echo "===== CLEAN USER CACHES ====="

          rm -rf ~/.cache || true
          rm -rf ~/.npm || true

          echo "===== CLEAN GRADLE TEMPORARY STATE ====="

          rm -rf ~/.gradle/daemon || true
          rm -rf ~/.gradle/notifications || true
          rm -rf ~/.gradle/native || true

          echo "===== CLEAN TEMP ====="

          sudo find /tmp -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true
          sudo find /var/tmp -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true

          echo "===== AFTER CLEANUP ====="

          df -h /
          df -ih /

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn

      - name: 📦 Install dependencies
        run: yarn install --immutable

      - name: 🧹 Configure Gradle
        run: |
          mkdir -p ~/.gradle

          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.daemon=false
          org.gradle.caching=true
          org.gradle.parallel=false
          org.gradle.configureondemand=false
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          EOF

          cat ~/.gradle/gradle.properties

      - name: 📱 Configure Android architecture
        run: |
          echo "Using ARM64 Android build"
          echo "ORG_GRADLE_PROJECT_reactNativeArchitectures=arm64-v8a" >> "$GITHUB_ENV"

      - name: 🔑 Restore Android Keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" |
            base64 --decode > apps/mobile/MindChart.keystore

      - name: 📝 Create local credentials.json
        working-directory: apps/mobile
        env:
          EAS_BUILD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          EAS_BUILD_KEYSTORE_ALIAS: ${{ secrets.KEY_ALIAS }}
          EAS_BUILD_KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          cat > credentials.json <<EOF
          {
            "android": {
              "keystore": {
                "keystorePath": "./MindChart.keystore",
                "keystorePassword": "${EAS_BUILD_KEYSTORE_PASSWORD}",
                "keyAlias": "${EAS_BUILD_KEYSTORE_ALIAS}",
                "keyPassword": "${EAS_BUILD_KEY_PASSWORD}"
              }
            }
          }
          EOF

      - name: ⚙️ Generate Android project
        working-directory: apps/mobile
        env:
          NODE_ENV: production
          APP_VARIANT: qa
        run: |
          npx expo prebuild \
            --platform android \
            --non-interactive \
            --no-install

      - name: 💾 Check disk before Gradle
        run: |
          echo "===== DISK ====="
          df -h /
          df -ih /

          echo "===== GRADLE ====="
          du -sh ~/.gradle 2>/dev/null || true

          echo "===== NODE MODULES ====="
          du -sh node_modules 2>/dev/null || true
          du -sh apps/mobile/node_modules 2>/dev/null || true

          echo "===== ANDROID ====="
          du -sh apps/mobile/android 2>/dev/null || true

      - name: 📱 Build Android APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
          APP_VARIANT: qa
          GRADLE_OPTS: >-
            -Dorg.gradle.jvmargs=-Xmx4096m
            -XX:MaxMetaspaceSize=1024m
            -Dorg.gradle.daemon=false
            -Dorg.gradle.caching=true
            -Dorg.gradle.parallel=false
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --build-cache \
            --max-workers=2

      - name: 📦 Copy APK
        run: |
          set -eux

          APK=$(find apps/mobile/android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          test -n "$APK"

          cp "$APK" ./MindChart-prod.apk

          ls -lh ./MindChart-prod.apk

      - name: 💾 Final disk check
        if: always()
        run: |
          echo "===== FILESYSTEM ====="
          df -h /
          df -ih /

          echo "===== GRADLE ====="
          du -sh ~/.gradle 2>/dev/null || true

          echo "===== WORKSPACE ====="
          du -xhd2 "$GITHUB_WORKSPACE" 2>/dev/null |
            sort -h |
            tail -30 || true

          echo "===== TEMP ====="
          sudo du -sh /tmp 2>/dev/null || true
          sudo du -sh /var/tmp 2>/dev/null || true

      - name: 🔑 Generate SHA256
        if: success()
        run: sha256sum ./MindChart-prod.apk > MindChart-prod.apk.sha256

      - name: 🔄 Fetch git history
        if: success()
        run: |
          git fetch --prune --tags --force
          git fetch --unshallow || true

      - name: 🏷️ Generate build info & changelog
        if: success()
        id: build-info
        run: |
          VERSION=$(node -p "require('./apps/mobile/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          BUILD_DATE=$(date -u +"%Y-%m-%d")

          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
              RANGE="--max-count=50"
          else
              RANGE="$LAST_TAG..HEAD"
          fi

          echo "## v$VERSION ($BUILD_DATE)" > changelog.md

          ALL_LOGS=$(git log $RANGE --pretty=format:"%s")

          FEATURE_LOGS=$(echo "$ALL_LOGS" | grep -Ei "^feat\s*(\(.*?\))?\s*:?" || true)
          NON_FEATURE_LOGS=$(echo "$ALL_LOGS" | grep -Eiv "^feat\s*(\(.*?\))?\s*:?" || true)

          if [ -n "$FEATURE_LOGS" ]; then
            echo "" >> changelog.md
            echo "## 🚀 Highlights" >> changelog.md
            echo "$FEATURE_LOGS" | sed 's/^/- /' >> changelog.md
          fi

          categories=(
            "🐛 Fixes:fix"
            "⚡ Improvements:perf|refactor|improve"
            "📝 Docs:docs"
            "⚙️ Chore:chore"
            "🔧 Build:build"
            "🤖 CI:ci"
            "🔄 Reverts:revert"
            "🎨 Style:style"
            "🧪 Tests:test"
          )

          for entry in "${categories[@]}"; do
            TITLE="${entry%%:*}"
            PATTERN="${entry#*:}"

            CATEGORY_LOG=$(echo "$NON_FEATURE_LOGS" | grep -Ei "^($PATTERN)\s*(\(.*?\))?\s*:?" | sed 's/^/- /' || true)

            if [ -n "$CATEGORY_LOG" ]; then
              echo "" >> changelog.md
              echo "### $TITLE" >> changelog.md
              echo "$CATEGORY_LOG" >> changelog.md
            fi
          done

      - name: 🔖 Tag source repository
        if: success()
        run: |
          VERSION="${{ steps.build-info.outputs.version }}"
          TAG="v${VERSION}"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists, skipping source tag."
            exit 0
          fi

          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}"

      - name: 📤 Push code and draft release to public repo
        if: success()
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          VERSION: ${{ steps.build-info.outputs.version }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN}" ]; then
            echo "Add repository secret PUBLIC_REPO_TOKEN (a PAT with contents:write on ${PUBLIC_REPO})."
            exit 1
          fi

          TAG="v${VERSION}"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${PUBLIC_REPO}.git"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git remote get-url public >/dev/null 2>&1; then
            git remote set-url public "$REMOTE"
          else
            git remote add public "$REMOTE"
          fi

          git push public HEAD:main --force

          if git ls-remote --exit-code --tags public "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Public tag ${TAG} already exists."
          else
            git push public "refs/tags/${TAG}"
          fi

          if gh release view "${TAG}" --repo "${PUBLIC_REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              ./MindChart-prod.apk \
              ./MindChart-prod.apk.sha256 \
              --repo "${PUBLIC_REPO}" \
              --clobber
            gh release edit "${TAG}" \
              --repo "${PUBLIC_REPO}" \
              --title "${TAG}" \
              --notes-file changelog.md \
              --draft
          else
            gh release create "${TAG}" \
              ./MindChart-prod.apk \
              ./MindChart-prod.apk.sha256 \
              --repo "${PUBLIC_REPO}" \
              --title "${TAG}" \
              --notes-file changelog.md \
              --draft
          fi

      - name: 📦 Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-builds
          path: |
            ./MindChart-prod.apk
            ./MindChart-prod.apk.sha256
          retention-days: 7
